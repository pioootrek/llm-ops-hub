schema_version: 1
id: FEAT-001
title: Salesforce read-only sync for opportunity context
type: feature
area: integrations
status: open
priority: next
risk:
  level: high
  dimensions:
    - external-integration
    - data-exposure
    - tenant-isolation
  rollback: Disable tenant-level CRM connections and hide cached CRM fields while keeping core PoV flows available.
decision:
  state: not_required
source:
  kind: test-seed
  refs:
    - "PR #244 FEAT-003 inspired seed"
summary: >
  Read Salesforce opportunity context into WinPath so managers can understand
  pipeline value without turning PoV execution into CRM administration.
problem: >
  Without a CRM anchor WinPath can look disconnected from account and
  opportunity reality during competitive evaluation.
value: >
  Read-only Salesforce context closes a parity gap and unlocks manager-level
  pipeline visibility while preserving the low-friction PoV workflow.
scope: >
  Link PoVs to Salesforce accounts/opportunities, display value and stage, and
  aggregate active-pipeline coverage. Excludes write-back and mapping UI.
validation: >
  Tenant isolation tests for connection reads, mocked Salesforce API failure
  paths, and manual QA against a sandbox org.
links:
  prs: [244]
  related_ids: []
