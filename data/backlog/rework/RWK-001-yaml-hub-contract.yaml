schema_version: 1
id: RWK-001
title: Migrate backlog source from Markdown topics to YAML records
type: rework
area: release-ops
status: in-progress
priority: now
risk:
  level: low
  dimensions:
    - process
  rollback: Keep Markdown docs as canonical until YAML parity is reviewed and approved.
decision:
  state: approved
source:
  kind: user-request
  refs:
    - LAN hub planning session 2026-07-03
summary: >
  Establish a YAML pseudo-database contract that is easier for LLM agents to
  edit and easier for the hub to render for humans.
problem: >
  Markdown-only backlog documents are readable, but they make structured
  filtering, validation, and branch overlays harder for agents.
value: >
  YAML records give agents a stable contract while the hub provides a richer
  HTML view for humans.
scope: >
  Start with local test YAML under the hub; migrate repository docs later after
  contract review.
validation: >
  Parser self-tests, generated HTML inspection, and later repository contract
  tests when the format moves into git.
links:
  prs: []
  related_ids: []
