name: Self-test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  self-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.x"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python bin/hub.py self-test
      - name: Validate this project's backlog
        run: |
          python bin/hub.py fmt --backlog-dir docs/backlog
          git diff --exit-code -- docs/backlog
          python bin/hub.py validate --backlog-dir docs/backlog
